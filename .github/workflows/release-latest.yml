name: Build the Docker images and push them to the container registry

on:
  push:
    branches: ["master"]
  workflow_dispatch: # manual trigger

jobs:
  build:
    runs-on: ubuntu-26.04

    strategy:
      matrix:
        target: [misp-core, misp-modules, misp-core-slim, misp-modules-slim, misp-guard, misp-nginx]

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          sed -e '/^[[:space:]]*$/d' -e '/[#@]/d' -e 's/\"//g' -e 's/\(^[^=]*\)=\(.*\)/\1="\2"/' template.env > env.hcl
          COMMIT_HASH="$(echo '${{ github.sha }}' | cut -c 1-7)"
          echo "COMMIT_HASH=$COMMIT_HASH" >> "$GITHUB_ENV"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "NAMESPACE=ghcr.io/${OWNER}/misp-docker" >> "$GITHUB_ENV"
          TARGET="${{ matrix.target }}"
          TAG="${COMMIT_HASH}"
          if [[ "$TARGET" == *"-slim" ]]; then
            TARGET="${TARGET%-slim}"
            TAG="${TAG}-slim"
          fi
          echo "IMAGE=ghcr.io/${OWNER}/misp-docker/${TARGET}:${TAG}" >> "$GITHUB_ENV"

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          provenance: false
          files: docker-bake.hcl, env.hcl
          targets: ${{ matrix.target }}

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: "spdx-json"
          output-file: "sbom-${{ matrix.target }}.spdx.json"
          dependency-snapshot: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.spdx.json
          if-no-files-found: warn
