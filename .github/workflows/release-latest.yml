name: Build the Docker images and push them to the container registry

on:
  push:
    branches: [ "master" ]
  workflow_dispatch: # manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target: [misp-core, misp-modules, misp-core-slim, misp-modules-slim, misp-guard, misp-nginx]

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          cache-image: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Initialize environment
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: |
          sed -e '/^[[:space:]]*$/d' -e '/[#@]/d' -e 's/\"//g' -e 's/\(^[^=]*\)=\(.*\)/\1="\2"/' template.env > env.hcl
          COMMIT_HASH="$(echo '${{ github.sha }}' | cut -c 1-7)"
          echo "COMMIT_HASH=$COMMIT_HASH" >> "$GITHUB_ENV"
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "NAMESPACE=ghcr.io/${OWNER}/misp-docker" >> "$GITHUB_ENV"
          if [[ "${{ matrix.target }}" == *"-slim" ]]; then
            BASE_TARGET="${{ matrix.target }}"
            BASE_TARGET="${BASE_TARGET%-slim}"
            echo "IMAGE=ghcr.io/${OWNER}/misp-docker/${BASE_TARGET}:${COMMIT_HASH}-slim" >> "$GITHUB_ENV"
          else
            echo "IMAGE=ghcr.io/${OWNER}/misp-docker/${{ matrix.target }}:${COMMIT_HASH}" >> "$GITHUB_ENV"
          fi

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/bake-action@v7
        with:
          source: .
          push: true
          provenance: false
          files: docker-bake.hcl, env.hcl
          targets: ${{ matrix.target }}
          # set: |
          #   *.cache-from=type=gha
          #   *.cache-to=type=gha,mode=max

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: "spdx-json"
          output-file: "sbom-${{ matrix.target }}.spdx.json"
          dependency-snapshot: false

      - name: Submit Dependency Snapshot to GitHub Dependency Graph
        uses: advanced-security/spdx-dependency-submission-action@v0
        with:
          filePath: "."
          filePattern: "sbom-${{ matrix.target }}.spdx.json"
          manifestPath: "${{ matrix.target }}"
          correlator: "${{ github.workflow }}-${{ github.job }}-${{ matrix.target }}"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.target }}
          path: sbom-${{ matrix.target }}.spdx.json
          if-no-files-found: warn
