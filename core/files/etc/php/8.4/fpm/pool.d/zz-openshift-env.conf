; PHP-FPM's default clear_env=yes strips the OS environment (including
; LD_PRELOAD and NSS_WRAPPER_PASSWD/GROUP) from request-handling worker
; processes. entrypoint.sh's nss_wrapper shim (see its comments) relies on
; those to make our arbitrary OpenShift UID resolve to "www-data" - without
; this, any `cake` subprocess PHP shells out to from within a web request
; inherits a stripped environment and fails MISP's own OS-user check
; ("This OS user is not allowed to run this command"), even though the
; same check passes fine for supervisord-managed workers and anything the
; entrypoint script itself invokes directly (neither goes through PHP-FPM).
[www]
clear_env = no
